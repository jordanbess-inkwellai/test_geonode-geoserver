id: geonode_geoserver_tests
namespace: dev_tests

description: |
  Enhanced Kestra flow to test GeoNode and GeoServer functionality
  with improved security, error handling, and monitoring capabilities.

  Features:
  - Secure credential management using environment variables
  - Comprehensive error handling and retry mechanisms
  - Detailed logging and monitoring
  - Configurable test parameters
  - Support for multiple test environments

variables:
  # Default configuration - override via environment variables or flow inputs
  default_timeout: "30"
  max_retries: "3"
  enable_cleanup: "false"
  verbose_logging: "false"

tasks:
  - id: validate_environment
    type: io.kestra.plugin.scripts.python.Commands
    description: "Validate environment and dependencies before running tests"
    commands:
      - python -c "import sys; print(f'Python version: {sys.version}')"
      - python -c "import requests; print(f'Requests version: {requests.__version__}')"
      - python -c "
          import os
          required_vars = ['GEONODE_URL', 'GEOSERVER_URL']
          missing = [var for var in required_vars if not os.getenv(var)]
          if missing:
              print(f'Warning: Missing environment variables: {missing}')
              print('Using default values from flow configuration')
          else:
              print('All required environment variables are set')
        "

  - id: install_dependencies
    type: io.kestra.plugin.scripts.python.Commands
    description: "Install required Python packages with version pinning"
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip list | grep -E "(papermill|requests|geopandas|owslib)"

  - id: run_geonode_tests
    type: io.kestra.core.tasks.flows.WorkingDirectory
    description: "Execute GeoNode-GeoServer integration tests"
    tasks:
    - id: papermill_execution
      type: io.kestra.plugin.scripts.python.Commands
      description: "Run Jupyter notebook tests with Papermill"
      env:
        # Security: Use environment variables for sensitive data
        GEONODE_URL: "{{ inputs.geonode_url }}"
        GEOSERVER_URL: "{{ inputs.geoserver_url }}"
        GEONODE_USERNAME: "{{ inputs.username }}"
        GEONODE_PASSWORD: "{{ inputs.password }}"
        SAMPLE_SHAPEFILE_PATH: "{{ inputs.sample_shapefile_path }}"
        SAMPLE_RASTER_PATH: "{{ inputs.sample_raster_path }}"
        DEFAULT_TIMEOUT: "{{ vars.default_timeout }}"
        MAX_RETRY_ATTEMPTS: "{{ vars.max_retries }}"
        ENABLE_CLEANUP: "{{ vars.enable_cleanup }}"
        VERBOSE_LOGGING: "{{ vars.verbose_logging }}"
      commands:
        - echo "Starting GeoNode-GeoServer integration tests..."
        - echo "GeoNode URL: $GEONODE_URL"
        - echo "GeoServer URL: $GEOSERVER_URL"
        - echo "Test data paths - Shapefile: $SAMPLE_SHAPEFILE_PATH, Raster: $SAMPLE_RASTER_PATH"
        - |
          papermill \
            notebooks/geonode_geoserver_tests_improved.ipynb \
            notebooks/output_geonode_geoserver_tests_$(date +%Y%m%d_%H%M%S).ipynb \
            --log-output \
            --progress-bar \
            --request-save-on-cell-execute \
            --autosave-cell-every 30
        - echo "Tests completed. Check output notebook for detailed results."
      timeout: PT30M  # 30 minutes timeout for the entire test suite

  - id: post_test_analysis
    type: io.kestra.plugin.scripts.python.Commands
    description: "Analyze test results and generate summary report"
    commands:
      - echo "Analyzing test results..."
      - python -c "
          import json
          import glob
          import os
          from datetime import datetime

          # Find the latest output notebook
          output_files = glob.glob('notebooks/output_geonode_geoserver_tests_*.ipynb')
          if output_files:
              latest_file = max(output_files, key=os.path.getctime)
              print(f'Latest test output: {latest_file}')

              # Basic analysis - in a real scenario, you'd parse the notebook
              # and extract test results from the cells
              file_size = os.path.getsize(latest_file)
              print(f'Output file size: {file_size} bytes')

              if file_size > 1000:  # Basic check for non-empty results
                  print('✓ Test execution appears successful (non-empty output)')
              else:
                  print('⚠ Warning: Output file is very small, tests may have failed')
          else:
              print('✗ No output files found - test execution may have failed')
        "

  - id: cleanup_temp_files
    type: io.kestra.plugin.scripts.python.Commands
    description: "Clean up temporary files if cleanup is enabled"
    condition: "{{ vars.enable_cleanup == 'true' }}"
    commands:
      - echo "Cleaning up temporary files..."
      - find . -name "*.tmp" -type f -delete
      - find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      - echo "Cleanup completed"

# Triggers for automated execution
triggers:
  - id: daily_health_check
    type: io.kestra.core.models.triggers.types.Schedule
    cron: "0 6 * * *"  # Daily at 6 AM
    description: "Daily health check of GeoNode-GeoServer integration"
    disabled: true  # Enable as needed

  - id: weekly_comprehensive_test
    type: io.kestra.core.models.triggers.types.Schedule
    cron: "0 2 * * 1"  # Weekly on Monday at 2 AM
    description: "Weekly comprehensive test suite"
    disabled: true  # Enable as needed

# Input parameters for the flow with enhanced validation and security
inputs:
  - name: geonode_url
    type: STRING
    defaults: "http://localhost:8000"
    description: "Base URL of the GeoNode instance"
    required: false

  - name: geoserver_url
    type: STRING
    defaults: "http://localhost:8080/geoserver"
    description: "Base URL of the GeoServer instance"
    required: false

  - name: username
    type: STRING
    defaults: "admin"
    description: "Username for authentication (use environment variables in production)"
    required: false

  - name: password
    type: STRING
    defaults: "geoserver"
    description: "Password for authentication (use environment variables in production)"
    required: false

  - name: sample_shapefile_path
    type: STRING
    defaults: "data/sample_vector.shp"
    description: "Path to sample shapefile for testing"
    required: false

  - name: sample_raster_path
    type: STRING
    defaults: "data/sample_raster.tif"
    description: "Path to sample raster file for testing"
    required: false

  - name: test_environment
    type: STRING
    defaults: "development"
    description: "Test environment identifier (development, staging, production)"
    required: false

  - name: notification_webhook
    type: STRING
    defaults: ""
    description: "Optional webhook URL for test result notifications"
    required: false
